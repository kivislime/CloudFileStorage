services:
  postgres:
    image: 'postgres:17'
    #   TODO: Переменные окружения?
    environment:
      - 'POSTGRES_DB=FileStorageDb'
      - 'POSTGRES_USER=user'
      - 'POSTGRES_PASSWORD=password'
    ports:
      - '5432:5432'
    networks:
      - appnet

  redis:
    image: redis:7
    ports:
      - 6379:6379
    networks:
      - appnet

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: filestorageapp:latest
    ports:
      - 8080:8080
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/FileStorageDb"
      SPRING_DATASOURCE_USERNAME: "user"
      SPRING_DATASOURCE_PASSWORD: "password"

      SPRING_REDIS_HOST: "redis"
      SPRING_REDIS_PORT: "6379"

      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - postgres
      - redis
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
