services:
  postgres:
    image: 'postgres:17'
    # TODO: Переменные окружения? .env файлы?
    # Также добавить volume, чтобы при удалении контейнеров данные сохранялись
    environment:
      - 'POSTGRES_DB=FileStorageDb'
      - 'POSTGRES_USER=user'
      - 'POSTGRES_PASSWORD=password'
    ports:
      - "5432:5432"
    networks:
      - appnet

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - appnet

  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command:
      server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - appnet

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: filestorageapp:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/FileStorageDb"
      SPRING_DATASOURCE_USERNAME: "user"
      SPRING_DATASOURCE_PASSWORD: "password"

      SPRING_REDIS_HOST: "redis"
      SPRING_REDIS_PORT: "6379"

      SPRING_PROFILES_ACTIVE: docker

      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: user-files

    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
